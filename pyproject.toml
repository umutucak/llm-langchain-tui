[project]
name = "llmtui"
version = "0.1.0"
description = "LangChain practice TUI with a self-hosted Ollama model"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.3.15",
    "langchain-community==0.4.2",
    "langgraph==1.2.11",
    "langchain-ollama==1.1.0",
    "grandalf==0.8",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langchain-milvus==0.4.0",
    "milvus-lite==3.2.0",
    "pymilvus==3.0.1",
    "pymupdf==1.28.2",
    "tqdm==4.70.0",
    "textual==8.2.8",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.7.2",
]

[tool.uv]
# Flat layout: app.py / scripts/ are run directly, nothing to build or install.
package = false

[dependency-groups]
dev = ["ruff==0.17.1", "mdformat==1.0.0"]

[tool.ruff]
line-length = 88

target-version = "py312"

[tool.ruff.lint]
# deliberate codebase patterns, not oversights:
# - BLE001: broad excepts in middleware/error routing and the mcp layer
# - S110:   try/except-pass around optional notification teardown
# - RUF012: mutable class attrs used as textual/langchain class-level state
# - TRY004: loaders raise RuntimeError for operator-facing config errors
ignore = ["BLE001", "S110", "RUF012", "TRY004"]

[tool.ruff.format]
# docstrings and comments are prose; the formatter leaves them alone and the
# width rule for them lives in AGENT.md instead

